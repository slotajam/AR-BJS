server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 60m;

  # Trust X-Forwarded-For only from the Docker network (the Caddy front end or a host proxy
  # on 127.0.0.1), so clients cannot spoof their IP to dodge the per-IP login throttle.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # SSE job progress
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri /index.html;
  }
}
