# Research Intelligence Platform — Phase 1 stack.
#   cp .env.example .env   # then edit secrets
#   docker compose up -d --build
#   open http://localhost:8080
name: research-intel

x-backend-env: &backend-env
  RIP_ENV: ${RIP_ENV:-production}
  RIP_DATABASE_URL: postgresql+psycopg://rip:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/rip
  RIP_REDIS_URL: redis://redis:6379/0
  RIP_SECRET_KEY: ${RIP_SECRET_KEY:?set RIP_SECRET_KEY}
  RIP_STORAGE_BACKEND: s3
  RIP_S3_ENDPOINT_URL: http://minio:9000
  RIP_S3_BUCKET: rip-private
  RIP_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  RIP_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  RIP_CONTACT_EMAIL: ${RIP_CONTACT_EMAIL:-}
  RIP_OPENALEX_ENABLED: ${RIP_OPENALEX_ENABLED:-true}
  RIP_OPENALEX_API_KEY: ${RIP_OPENALEX_API_KEY:-}
  RIP_CROSSREF_ENABLED: ${RIP_CROSSREF_ENABLED:-true}
  RIP_CROSSREF_PLUS_TOKEN: ${RIP_CROSSREF_PLUS_TOKEN:-}
  RIP_ALLOW_REGISTRATION: ${RIP_ALLOW_REGISTRATION:-true}
  RIP_ACCESS_TOKEN_MINUTES: ${RIP_ACCESS_TOKEN_MINUTES:-60}
  RIP_LOGIN_MAX_FAILURES: ${RIP_LOGIN_MAX_FAILURES:-10}
  RIP_LOGIN_WINDOW_SECONDS: ${RIP_LOGIN_WINDOW_SECONDS:-900}
  RIP_EMBEDDING_PROVIDER: ${RIP_EMBEDDING_PROVIDER:-hashing}
  RIP_PGVECTOR_ENABLED: ${RIP_PGVECTOR_ENABLED:-true}
  RIP_CORS_ORIGINS: ${RIP_CORS_ORIGINS:-["http://localhost:8080"]}

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: rip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rip
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rip"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]   # durable broker queue across restarts
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
                  mc mb --ignore-existing local/rip-private &&
                  mc anonymous set none local/rip-private"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  migrate:
    build: ./backend
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 10

  worker:
    build: ./backend
    environment: *backend-env
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "rip", "-l", "info", "--concurrency", "2"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
